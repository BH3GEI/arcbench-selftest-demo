# One command: docker compose up --build
#
# Recommended-production topology (docs/security-review.md open item #1):
# `api` (internet-facing, no Docker socket) + `worker` (has the Docker
# socket — full code-execution privilege on the host — but exposes no port
# at all, nothing an attacker can reach directly). They share ./data via a
# bind mount instead of an API call between them.
#
# For a single-container local/demo setup instead, run the image directly
# with SELFTEST_ROLE=all (see server/app/config.py) and the docker socket
# mounted into that one container — not recommended for anything
# internet-facing.
#
# Override any SELFTEST_* value in a local .env (copy .env.example to start).
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: selftest-server:local
    # Bind loopback-only: terminate TLS at the `proxy` service (or your own
    # reverse proxy) in front of this, never expose plain HTTP to the
    # internet directly (docs/security-review.md open item #9).
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SELFTEST_ROLE: api
      SELFTEST_DATA_DIR: /data
      SELFTEST_TASKS_DIR: /tasks
      SELFTEST_AUTH_MODE: ${SELFTEST_AUTH_MODE:-token}
      SELFTEST_TEAM_TOKENS: ${SELFTEST_TEAM_TOKENS:-demo=demo-token}
      SELFTEST_TEAM_SECRETS: ${SELFTEST_TEAM_SECRETS:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      SELFTEST_SESSION_SECRET: ${SELFTEST_SESSION_SECRET:-}
      SELFTEST_OAUTH_CALLBACK_URL: ${SELFTEST_OAUTH_CALLBACK_URL:-}
      SELFTEST_MIN_ACCOUNT_AGE_DAYS: ${SELFTEST_MIN_ACCOUNT_AGE_DAYS:-7}
      SELFTEST_FORCE_HTTPS: ${SELFTEST_FORCE_HTTPS:-0}
      SELFTEST_DAILY_LIMIT: ${SELFTEST_DAILY_LIMIT:-10}
      SELFTEST_JOB_QUEUE_MAX: ${SELFTEST_JOB_QUEUE_MAX:-100}
      SELFTEST_RETENTION_HOURS: ${SELFTEST_RETENTION_HOURS:-720}
      SELFTEST_LOG_FORMAT: ${SELFTEST_LOG_FORMAT:-text}
      SELFTEST_LOG_LEVEL: ${SELFTEST_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data
      - ./tasks:/tasks:ro
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: selftest-server:local
    environment:
      SELFTEST_ROLE: worker
      SELFTEST_DATA_DIR: /data
      SELFTEST_HOST_DATA_DIR: ${PWD}/data
      SELFTEST_TASKS_DIR: /tasks
      SELFTEST_HOST_TASKS_DIR: ${PWD}/tasks
      SELFTEST_RUNNER_CONTEXT_DIR: /runner
      SELFTEST_JOB_WORKERS: ${SELFTEST_JOB_WORKERS:-1}
      SELFTEST_LOG_FORMAT: ${SELFTEST_LOG_FORMAT:-text}
      SELFTEST_LOG_LEVEL: ${SELFTEST_LOG_LEVEL:-INFO}
    volumes:
      # The only service with the host Docker socket — full code-execution
      # privilege on the host — and it has no exposed port at all.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./tasks:/tasks:ro
      - ./runner:/runner:ro
    # Generous relative to a single build+test run; this is the process that
    # drives `docker build`/`docker run` for submissions, not the submission
    # itself (that's bounded separately by SELFTEST_APP_MEM/APP_CPUS and
    # SELFTEST_BUILD_MEM/BUILD_CPUS).
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped

  # HTTPS termination example — disabled by default. Enable with:
  #   docker compose --profile proxy up --build
  # after pointing deploy/Caddyfile at a real domain (Caddy gets certs from
  # Let's Encrypt automatically) or swapping in deploy/nginx.conf.example +
  # your own certs. Either way `api` itself stays on plain HTTP behind it,
  # reachable only via loopback (see `api.ports` above).
  proxy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
