name: Grade submission

# Two ways in:
#  - repository_dispatch (event_type: grade-submission): the self-test
#    service calls this with a service PAT after its own quota check passes.
#    client_payload: { submission_id, task_id, download_url, callback_url?,
#                       submission_timestamp?, submission_signature? }
#    submission_timestamp/signature: HMAC-SHA256 of "{submission_id}.
#    {task_id}.{submission_timestamp}" with SELFTEST_DISPATCH_SIGNING_KEY,
#    taken as proof quota was already checked — see scripts/verify_signature.py
#    and README_ACTIONS.md "Quota" / "Submitter identity".
#  - workflow_dispatch: manual/testing trigger with the same fields as inputs,
#    plus visibility_override for exercising the hidden-visibility path
#    without editing a task's requirements.yaml.
on:
  repository_dispatch:
    types: [grade-submission]
  workflow_dispatch:
    inputs:
      submission_id:
        required: true
        type: string
      task_id:
        required: true
        type: string
      download_url:
        required: true
        type: string
      visibility_override:
        required: false
        type: choice
        options: ["", public, hidden]
        default: ""
      submission_timestamp:
        required: false
        type: string
        description: "unix seconds; only needed to test signature rejection"
      submission_signature:
        required: false
        type: string
        description: "hex HMAC-SHA256; only needed to test signature rejection"

jobs:
  # Computes a bounded "lane" (hash of submission_id mod GRADE_LANES; kept as
  # an output for logs only — see the grade job on why it is no longer a
  # concurrency group), validates/normalizes every untrusted input, and verifies the dispatch's HMAC signature. This
  # is the ONLY job that holds SELFTEST_DISPATCH_SIGNING_KEY, and it never
  # checks out or runs anything derived from the submission itself (no
  # download, no build) — so holding that secret here is safe even though
  # the submission content is fully untrusted at this point.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      submission_id: ${{ steps.in.outputs.submission_id }}
      task_id: ${{ steps.in.outputs.task_id }}
      download_url: ${{ steps.in.outputs.download_url }}
      visibility_override: ${{ steps.in.outputs.visibility_override }}
      callback_url: ${{ steps.sig.outputs.callback_url }}
      lane: ${{ steps.in.outputs.lane }}
      dispatch_status: ${{ steps.sig.outputs.status }}
      dispatch_detail: ${{ steps.sig.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the job token out of .git/config on disk, where the untrusted
          # build step's process tree could otherwise read it.
          persist-credentials: false

      # Payload fields go through env, never ${{ }} inside the script body, so
      # a crafted value cannot inject shell or extra $GITHUB_OUTPUT lines.
      # visibility_override is only honoured for manual workflow_dispatch runs
      # — a repository_dispatch caller cannot override a task's own setting.
      - name: Normalize inputs and compute lane
        id: in
        env:
          IN_SUBMISSION_ID: ${{ github.event.inputs.submission_id || github.event.client_payload.submission_id }}
          IN_TASK_ID: ${{ github.event.inputs.task_id || github.event.client_payload.task_id }}
          IN_DOWNLOAD_URL: ${{ github.event.inputs.download_url || github.event.client_payload.download_url }}
          IN_VISIBILITY_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.visibility_override || '' }}
          IN_CALLBACK_URL: ${{ github.event.client_payload.callback_url || '' }}
          IN_SUBMISSION_TIMESTAMP: ${{ github.event.inputs.submission_timestamp || github.event.client_payload.submission_timestamp || '' }}
          IN_SUBMISSION_SIGNATURE: ${{ github.event.inputs.submission_signature || github.event.client_payload.submission_signature || '' }}
          GRADE_LANES: "4"
        run: |
          set -euo pipefail
          ok() { [[ "$1" =~ $2 ]] || { echo "invalid $3" >&2; exit 1; }; }
          ok "$IN_SUBMISSION_ID" '^[A-Za-z0-9_-]{1,64}$' submission_id
          ok "$IN_TASK_ID" '^[A-Za-z0-9_-]{1,64}$' task_id
          ok "$IN_DOWNLOAD_URL" '^https://[^[:space:]]+$' download_url
          ok "$IN_VISIBILITY_OVERRIDE" '^(public|hidden)?$' visibility_override
          ok "$IN_CALLBACK_URL" '^(https://[^[:space:]]+)?$' callback_url
          ok "$IN_SUBMISSION_TIMESTAMP" '^[0-9]*$' submission_timestamp
          ok "$IN_SUBMISSION_SIGNATURE" '^[0-9a-fA-F]*$' submission_signature
          LANE=$(( $(echo -n "$IN_SUBMISSION_ID" | cksum | cut -d' ' -f1) % GRADE_LANES ))
          {
            echo "submission_id=$IN_SUBMISSION_ID"
            echo "task_id=$IN_TASK_ID"
            echo "download_url=$IN_DOWNLOAD_URL"
            echo "visibility_override=$IN_VISIBILITY_OVERRIDE"
            echo "callback_url=$IN_CALLBACK_URL"
            echo "submission_timestamp=$IN_SUBMISSION_TIMESTAMP"
            echo "submission_signature=$IN_SUBMISSION_SIGNATURE"
            echo "lane=$LANE"
          } >> "$GITHUB_OUTPUT"

      # Authenticates the dispatch itself — see scripts/verify_signature.py
      # and README_ACTIONS.md "Submitter identity & quota". An invalid or
      # unauthenticated dispatch means submission_id/task_id/callback_url are
      # all untrusted too, so callback_url is dropped (status=rejected below
      # skips the build entirely in the `grade` job — no secret, no build,
      # no callback for a request that never proved it was the real service).
      - name: Verify dispatch signature
        id: sig
        env:
          SUBMISSION_ID: ${{ steps.in.outputs.submission_id }}
          TASK_ID: ${{ steps.in.outputs.task_id }}
          SUBMISSION_TIMESTAMP: ${{ steps.in.outputs.submission_timestamp }}
          SUBMISSION_SIGNATURE: ${{ steps.in.outputs.submission_signature }}
          CALLBACK_URL: ${{ steps.in.outputs.callback_url }}
          SELFTEST_DISPATCH_SIGNING_KEY: ${{ secrets.SELFTEST_DISPATCH_SIGNING_KEY }}
        run: |
          set -uo pipefail
          # `|| SIG_RC=$?`, not a bare `SIG_RC=$?` on the next line: the
          # step's shell runs with -e, so a failing command substitution in a
          # plain assignment aborted the step before status=rejected was
          # written, failing the whole job instead.
          SIG_RC=0
          SIG_ERR="$(python3 scripts/verify_signature.py \
            --submission-id "$SUBMISSION_ID" --task-id "$TASK_ID" \
            --timestamp "${SUBMISSION_TIMESTAMP:-0}" --signature "${SUBMISSION_SIGNATURE:-}" 2>&1 >/dev/null)" || SIG_RC=$?
          if [ "$SIG_RC" -ne 0 ]; then
            {
              echo "status=rejected"
              echo "detail=dispatch rejected: ${SIG_ERR:-invalid signature}"
              echo "callback_url="
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "status=ok"
              echo "detail="
              echo "callback_url=$CALLBACK_URL"
            } >> "$GITHUB_OUTPUT"
          fi

  # Builds and runs the submitted app — fully untrusted code. Read-only
  # GITHUB_TOKEN, and the only secret it can see is APP_DOWNLOAD_TOKEN
  # (scoped to read-only access to app zip storage, nothing else; see
  # README_ACTIONS.md "Secrets & least privilege"). No CALLBACK_TOKEN, no
  # SELFTEST_DISPATCH_SIGNING_KEY, no write access to this repo: a container
  # escape here cannot push to the grader repo or forge a result callback.
  grade:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # No `concurrency:` group here on purpose. A group keeps at most ONE
    # pending job: a third submission landing in a busy lane cancelled the
    # one already waiting ("Canceling since a higher priority waiting request
    # exists"), its report job was skipped, and that submission never got a
    # result. GitHub's own runner queue already queues without dropping.
    outputs:
      result_status: ${{ steps.summary.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Grade
        id: run
        continue-on-error: true
        env:
          SUBMISSION_ID: ${{ needs.prepare.outputs.submission_id }}
          TASK_ID: ${{ needs.prepare.outputs.task_id }}
          DOWNLOAD_URL: ${{ needs.prepare.outputs.download_url }}
          VISIBILITY_OVERRIDE: ${{ needs.prepare.outputs.visibility_override }}
          DISPATCH_STATUS: ${{ needs.prepare.outputs.dispatch_status }}
          DISPATCH_DETAIL: ${{ needs.prepare.outputs.dispatch_detail }}
          APP_DOWNLOAD_TOKEN: ${{ secrets.APP_DOWNLOAD_TOKEN }}
        run: bash scripts/grade.sh

      - name: Summarize result for the report job
        id: summary
        if: always()
        run: |
          if [ -f .gradework/results/result.json ]; then
            STATUS="$(python3 -c "import json;print(json.load(open('.gradework/results/result.json'))['status'])")"
          else
            STATUS="system_error"
          fi
          echo "result status: $STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # Small, specific artifact the `report` job downloads to deliver the
      # result — never the whole .gradework tree (that's the debug artifact
      # below, for maintainers only).
      - name: Upload result.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ needs.prepare.outputs.submission_id }}
          path: .gradework/results/result.json
          retention-days: 1
          if-no-files-found: ignore

      # Debugging aid for whoever maintains this grader repo, not for
      # participants (who never have access to this repo or its artifacts).
      # Safe to delete if you don't want build/runner logs retained at all —
      # see docs/security-review.md item #6.
      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ needs.prepare.outputs.submission_id }}
          path: .gradework/results
          retention-days: 3
          if-no-files-found: ignore

  # Delivers the result to the submitter — the only job with contents:write
  # and the callback/signing secrets. It never checks out the submission,
  # builds anything, or runs Docker: its only input from the untrusted path
  # is result.json, already visibility-filtered by parse_report.py in the
  # `grade` job. Runs even if `grade` failed/timed out so a participant
  # (or the self-test service) always gets a structured answer back.
  report:
    needs: [prepare, grade]
    # always(), not !cancelled(): a cancelled or skipped grade job must still
    # produce a (system_error) answer, or the submitter waits forever.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download result.json
        id: dl
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: result-${{ needs.prepare.outputs.submission_id }}
          path: .gradework/results

      # grade.sh / its job can fail before ever producing result.json
      # (e.g. the runner OOM-killed the whole job) — synthesize one rather
      # than silently reporting nothing back.
      - name: Synthesize a fallback result if none was produced
        if: steps.dl.outcome != 'success'
        run: |
          mkdir -p .gradework/results
          python3 -c "
          import json
          json.dump({
              'submission_id': '${{ needs.prepare.outputs.submission_id }}',
              'task_id': '${{ needs.prepare.outputs.task_id }}',
              'visibility': 'public',
              'status': 'system_error',
              'passed': 0,
              'total': 0,
              'detail': 'grade job produced no result (crashed or was killed)',
          }, open('.gradework/results/result.json', 'w'))
          "

      - name: Report back
        env:
          CALLBACK_URL: ${{ needs.prepare.outputs.callback_url }}
          CALLBACK_TOKEN: ${{ secrets.SELFTEST_CALLBACK_TOKEN }}
          SELFTEST_DISPATCH_SIGNING_KEY: ${{ secrets.SELFTEST_DISPATCH_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          RESULT_FILE: .gradework/results/result.json
        run: python3 scripts/report_back.py
